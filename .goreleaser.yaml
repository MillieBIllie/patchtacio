# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Signing, SBOMs, Homebrew, Scoop, Docker and packages are added in milestone M6.
version: 2

project_name: patchtacio

before:
  hooks:
    # Check, never modify: release binaries must match the committed module graph.
    - go mod tidy -diff
    - go mod verify

builds:
  - id: patchtacio
    main: ./cmd/patchtacio
    binary: patchtacio
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/milliebillie/patchtacio/internal/version.Version={{ .Version }}
      - -X github.com/milliebillie/patchtacio/internal/version.Commit={{ .Commit }}
      - -X github.com/milliebillie/patchtacio/internal/version.Date={{ .CommitDate }}
  # The same program as a Windows GUI program: the scheduled check runs it, so no
  # console window flashes (docs/decisions/0004-m4-scheduling.md).
  - id: patchtaciow
    main: ./cmd/patchtacio
    binary: patchtaciow
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -H=windowsgui
      - -X github.com/milliebillie/patchtacio/internal/version.Version={{ .Version }}
      - -X github.com/milliebillie/patchtacio/internal/version.Commit={{ .Commit }}
      - -X github.com/milliebillie/patchtacio/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    # Windows archives also hold patchtaciow.exe.
    allow_different_binary_count: true
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
