# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Signing, SBOMs, Homebrew, Scoop, Docker and packages are added in milestone M6.
version: 2

project_name: patchtacio

before:
  hooks:
    - go mod tidy

builds:
  - id: patchtacio
    main: ./cmd/patchtacio
    binary: patchtacio
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/milliebillie/patchtacio/internal/version.Version={{ .Version }}
      - -X github.com/milliebillie/patchtacio/internal/version.Commit={{ .Commit }}
      - -X github.com/milliebillie/patchtacio/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
